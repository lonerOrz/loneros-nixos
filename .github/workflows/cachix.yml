name: cachix-matrix

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  NIXPKGS_ALLOW_INSECURE: "1"

jobs:
  detect-missing:
    name: Detect Missing Packages
    runs-on: ubuntu-latest
    outputs:
      missing_packages: ${{ steps.check.outputs.missing }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true

      - name: Setup Nix environment
        run: |
          nix-channel --add https://nixos.org/channels/nixpkgs-unstable nixpkgs
          nix-channel --update

      - name: Check Cache and Output Matrix
        id: check
        run: |
          chmod +x .github/script/check-cache.py
          python .github/script/check-cache.py

  build-matrix:
    name: Build ${{ matrix.package.name }}
    needs: detect-missing
    if: ${{ needs.detect-missing.outputs.missing_packages != '[]' && needs.detect-missing.outputs.missing_packages != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect-missing.outputs.missing_packages) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main

      - name: Add swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 20

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: loneros
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: Build Path
        id: build
        continue-on-error: true
        run: |
          echo "Building ${{ matrix.package.name }}..."
          nix build --no-link --impure --expr 'let flake = builtins.getFlake (toString ./.); pkgs = flake.nixosConfigurations.loneros.config.environment.systemPackages; target = builtins.filter (p: p ? drvPath && p.drvPath == "${{ matrix.package.drv }}") pkgs; in if target == [] then throw "Package not found" else builtins.head target' --print-build-logs

      - name: Generate status report
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" == "success" ]; then
            SUCCESSFUL="true"
          else
            SUCCESSFUL="false"
          fi

          jq -n \
            --arg name "${{ matrix.package.name }}" \
            --arg drv "${{ matrix.package.drv }}" \
            --arg successful "$SUCCESSFUL" \
            '{"name": $name, "drv": $drv, "successful": ($successful | test("true"))}' > "report_${{ matrix.package.name }}.json"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-report-${{ matrix.package.name }}
          path: report_${{ matrix.package.name }}.json

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-matrix]
    if: always()
    steps:
      - name: Download all reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: build-report-*
          merge-multiple: true

      - name: Generate combined step summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs \
            --jq '.jobs[] | select(.name != null) | {
              key: .name,
              value: (
                .html_url + (
                  [ .steps[] | select(.name == "Build Path") | .number ] | first | if . != null then "#step:" + (tostring) + ":1" else "" end
                )
              )
            }' | jq -s 'from_entries' > job_urls.json

          {
            echo "### Cachix Build Results"
            echo ""
            echo "| Package | Status | Derivation |"
            echo "| :--- | :--- | :--- |"

            for f in report_*.json; do
              if [ ! -f "$f" ]; then continue; fi
              NAME=$(jq -r '.name' "$f")
              DRV=$(jq -r '.drv' "$f")
              SUCCESS=$(jq -r '.successful' "$f")

              JOB_NAME="Build $NAME"
              JOB_URL=$(jq -r --arg key "$JOB_NAME" '.[$key] // empty' job_urls.json)
              if [ -z "$JOB_URL" ]; then
                JOB_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              fi

              if [ "$SUCCESS" = "true" ]; then
                STATUS="[Success]($JOB_URL)"
              else
                STATUS="[Failed]($JOB_URL)"
              fi

              echo "| \`$NAME\` | $STATUS | \`$DRV\` |"
            done
          } > summary_report.md

          cat summary_report.md >> $GITHUB_STEP_SUMMARY

          FAILED_COUNT=$(grep -c '"successful": false' report_*.json 2>/dev/null || echo 0)

          if [ "$FAILED_COUNT" -gt 0 ]; then
            echo "::warning::Some packages failed to build — see summary above." >&2
          fi

      - name: Post PR comment on failure
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.number != null &&
          always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          FAILED_PACKAGES=$(for f in report_*.json; do
            [ ! -f "$f" ] && continue
            jq -r 'select(.successful == false) | "\(.name)|\(.drv)"' "$f" 2>/dev/null
          done | sort -u)

          FAILED_COUNT=0
          printf '## Cachix Build Failures\n\n' > /tmp/cachix_pr_comment.md
          printf 'Failed packages in this run. View full results: [%s](%s)\n\n' "$RUN_URL" "$RUN_URL" >> /tmp/cachix_pr_comment.md
          printf '| Package | Derivation |\n| :--- | :--- |\n' >> /tmp/cachix_pr_comment.md

          while IFS='|' read -r NAME DRV; do
            [ -z "$NAME" ] && continue
            SHORT_DRV=$(echo "$DRV" | sed 's|.*/||')
            printf '| `%s` | `%s` |\n' "$NAME" "$SHORT_DRV" >> /tmp/cachix_pr_comment.md
            FAILED_COUNT=$((FAILED_COUNT + 1))
          done <<< "$FAILED_PACKAGES"

          printf '\n> This comment is auto-generated by the cachix-matrix workflow.\n' >> /tmp/cachix_pr_comment.md

          if [ "$FAILED_COUNT" -gt 0 ]; then
            gh pr comment "$PR_NUMBER" --body-file /tmp/cachix_pr_comment.md
            echo "Posted PR comment with $FAILED_COUNT failed package(s)."
          fi
